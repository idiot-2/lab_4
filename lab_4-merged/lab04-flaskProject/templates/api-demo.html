{% extends "base.html" %}
{% block title %}API Демонстрація{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">Демонстрація роботи API</h1>

<!-- Повідомлення -->
<div id="message" class="hidden p-3 rounded mb-4"></div>

<!-- КНОПКА: Завантажити товари -->
<button onclick="loadProducts()" class="px-4 py-2 bg-purple-700 hover:bg-purple-800 rounded">
    Завантажити всі товари
</button>

<!-- Список товарів -->
<h2 class="text-2xl font-bold mt-6 mb-2">Товари</h2>
<div id="productsList" class="space-y-3"></div>

<hr class="my-6 border-purple-600" />

<!-- Створення замовлення -->
<h2 class="text-2xl font-bold mb-2">Створити замовлення</h2>

<form id="orderForm" class="space-y-3">
    <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded" required>
    <input id="address" type="text" placeholder="Адреса" class="w-full p-2 border rounded" required>

    <textarea id="cart" class="w-full p-2 border rounded"
              placeholder="Cart JSON ({ '1': { 'id': 1, 'quantity': 2, 'price': 100 } })"
              rows="4" required></textarea>

    <button class="px-4 py-2 bg-purple-700 hover:bg-purple-800 rounded">Створити замовлення</button>
</form>

{% endblock %}

{% block scripts %}
<script>
// ================================
// НАЛАШТУВАННЯ
// ================================
const API_PRODUCTS = "/api/products";
const API_ORDERS = "/api/orders";

// ================================
// ПОВІДОМЛЕННЯ
// ================================
function showMessage(text, type = "info") {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `p-3 rounded mb-4 ${type === "error" ? "bg-red-600" : "bg-green-600"}`;
    box.classList.remove("hidden");
    setTimeout(() => box.classList.add("hidden"), 3000);
}

// ================================
// 1) Отримати товари
// ================================
async function loadProducts() {
    try {
        const response = await fetch(API_PRODUCTS);
        const result = await response.json();

        if (!response.ok) throw new Error(result.message);

        displayProducts(result.data);
        showMessage("Товари завантажено!");
    } catch (error) {
        showMessage("Помилка: " + error.message, "error");
    }
}

function displayProducts(products) {
    const container = document.getElementById("productsList");
    container.innerHTML = "";

    if (products.length === 0) {
        container.innerHTML = "<p>Немає товарів.</p>";
        return;
    }

    products.forEach(p => {
        const div = document.createElement("div");
        div.className = "p-4 border rounded";
        div.innerHTML = `
            <h3 class="text-xl font-bold">${p.name}</h3>
            <p>Ціна: ${p.price} грн</p>
        `;
        container.appendChild(div);
    });
}

// ================================
// 2) Створити замовлення
// ================================
document.getElementById("orderForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    let cart;

    try {
        cart = JSON.parse(document.getElementById("cart").value);
    } catch {
        showMessage("Невірний формат JSON!", "error");
        return;
    }

    try {
        const response = await fetch(API_ORDERS, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, address, cart })
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.message);

        showMessage("Замовлення створено!");
        event.target.reset();

    } catch (error) {
        showMessage("Помилка створення: " + error.message, "error");
    }
});
</script>
{% endblock %}
