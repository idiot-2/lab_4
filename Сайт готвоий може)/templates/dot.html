{% extends 'base.html' %}

{% block title %}Точка{% endblock %}

{% block content %}
<div class="text-center">
  <button id="reveal-btn" class="Pknopk">хочу бесплатний ключ</button>
  <div class="mt-4 flex justify-center">
    <img id="monkey-img" src="{{ url_for('dot.dot_image') }}" alt="monkey" class="hidden mx-auto max-w-full h-auto" />
  </div>
</div>

<script>
document.getElementById('reveal-btn').addEventListener('click', function(){
  const img = document.getElementById('monkey-img');
  img.classList.remove('hidden');
  img.classList.add('block');
  this.disabled = true;
});
</script>
{% endblock %}
